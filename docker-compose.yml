services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 settings.asgi:application"
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - static_volume:/var/www/static
      - media_volume:/var/www/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    restart: unless-stopped
    command: celery -A settings worker -l info
    env_file:
      - .env
    depends_on:
      - redis
      - web

  celery_beat:
    build: .
    restart: unless-stopped
    command: celery -A settings beat -l info
    env_file:
      - .env
    depends_on:
      - redis
      - web

  flower:
    build: .
    restart: unless-stopped
    command: celery -A settings flower --port=5555 --basic_auth=${BLOG_FLOWER_USER}:${BLOG_FLOWER_PASSWORD}
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - redis
  
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
  sqlite_data: